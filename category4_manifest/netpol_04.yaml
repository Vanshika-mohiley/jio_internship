apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-netpol
  namespace: default
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
              matchLabels:
                role: frontend
  egress:
    - to:
        - podSelector:
              matchLabels:
                role: backend
