apiVersion: v1
kind: Pod
metadata:
  name: sample-app
  namespace: default
spec:
  hostPID: false
  hostNetwork: false
  containers:
    - name: app
      image: registry.example.com/app:1.0
      securityContext:
        privileged: true
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
