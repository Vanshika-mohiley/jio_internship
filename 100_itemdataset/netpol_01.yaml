apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: sample-app
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
              matchLabels:
                role: frontend
  egress:
    - to:
        - podSelector:
              matchLabels:
                role: backend
